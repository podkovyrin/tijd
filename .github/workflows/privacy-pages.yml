name: Publish privacy policy

# Publishing is deliberate: push the repository, enable Pages, then run this
# workflow manually from main. Future policy updates use the same workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: privacy-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Build the policy from the app's offline copy
        run: python3 scripts/build_privacy_page.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/privacy-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
